  <script>
    const header=document.getElementById('site-header'),nav=document.getElementById('primary-nav'),toggle=header.querySelector('.nav-toggle');
    const closeNav=()=>{nav.classList.remove('header-nav-open');toggle.setAttribute('aria-expanded','false');toggle.setAttribute('aria-label','فتح القائمة')};
    toggle.addEventListener('click',()=>{const opening=toggle.getAttribute('aria-expanded')!=='true';nav.classList.toggle('header-nav-open',opening);toggle.setAttribute('aria-expanded',String(opening));toggle.setAttribute('aria-label',opening?'إغلاق القائمة':'فتح القائمة')});
    nav.addEventListener('click',event=>{if(event.target.closest('a'))closeNav()});
    document.addEventListener('click',event=>{if(!header.contains(event.target))closeNav()});
    document.addEventListener('keydown',event=>{if(event.key==='Escape')closeNav()});
